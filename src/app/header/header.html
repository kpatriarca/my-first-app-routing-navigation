<header class="intro">
  <div class="intro-details">
    <h1>{{ fullName() }}</h1>

    <p>
      {{ location() }} |
      {{ phone() }} |
      <a [href]="'mailto:' + email()">{{ email() }}</a>
    </p>
  </div>

  <div class="intro-logo">
    <img src="/logo1.png" alt="Personal Logo">
  </div>
</header>

<section class="personal-profile">
  <h2>Personal Profile</h2>
  <p>{{ profile() }}</p>
</section>
